# Serves the built dashboard and proxies API calls to the backend
# container so the browser only ever talks to one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same set added to the API itself (see backend/app/main.py's
    # security_headers middleware) and to the Vercel deployment path (see
    # vercel.json) — this is the third of three places that can end up
    # serving the dashboard's HTML/static assets, so it needs its own copy
    # rather than inheriting anything from the other two paths.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # Single-page app: any unmatched path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
