# Serves the built dashboard and proxies API calls to the backend
# container so the browser only ever talks to one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # Single-page app: any unmatched path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
